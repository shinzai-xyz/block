<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluesky Block Checker</title>
    <meta name="theme-color" content="#0ea5e9">

    <link rel="icon" type="image/png" href="image/icon.png">
    <link rel="apple-touch-icon" href="image/icon.png">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-b from-sky-50 via-slate-50 to-white text-slate-800 min-h-screen flex flex-col justify-between font-sans selection:bg-sky-200 selection:text-sky-900">

    <div class="sticky top-0 z-50 pt-4 px-4 sm:px-6 w-full max-w-4xl mx-auto">
        <header class="bg-white/60 backdrop-blur-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/80 rounded-3xl py-3 px-6 flex justify-between items-center transition-all">
            <h1 class="text-lg sm:text-xl font-extrabold text-slate-800 flex items-center gap-2 tracking-tight">
                Block Checker <span class="text-[10px] font-black bg-gradient-to-tr from-sky-500 to-indigo-500 text-white px-2 py-0.5 rounded-md ml-1 shadow-sm uppercase tracking-widest">PRO</span>
            </h1>
        </header>
    </div>

    <main class="max-w-2xl w-full mx-auto px-4 py-12 flex-grow flex flex-col relative z-10">
        
        <div class="bg-white/70 backdrop-blur-2xl p-6 sm:p-8 rounded-[2.5rem] shadow-sm border border-white mb-8 transition-all relative overflow-hidden group hover:shadow-md">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-sky-400/10 rounded-full blur-3xl group-hover:bg-sky-400/20 transition-all duration-700"></div>

            <label for="handleInput" class="block text-sm font-bold text-slate-500 mb-3 ml-2 tracking-wide">
                Bluesky ID または did:plc: を入力
            </label>
            <div class="flex flex-col sm:flex-row gap-4 relative z-10">
                <div class="flex-grow flex items-center px-5 py-3.5 bg-white border border-slate-200/80 rounded-2xl focus-within:ring-4 focus-within:ring-sky-500/15 focus-within:border-sky-400 shadow-inner transition-all duration-300">
                    <svg class="w-5 h-5 text-slate-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span class="text-sky-400 font-black text-lg mr-1 select-none">@</span>
                    <input type="text" id="handleInput" placeholder="username.bsky.social" autocomplete="off" spellcheck="false"
                        class="w-full bg-transparent focus:outline-none text-base font-medium text-slate-800 placeholder-slate-300">
                </div>
                <button id="searchBtn" class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-sky-600 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg hover:shadow-sky-500/25 hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                    <div id="loadingSpinner" class="hidden w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                    <span id="btnText">リストを取得</span>
                </button>
            </div>
        </div>

        <div id="statusContainer" class="hidden">
            <div class="status-inner flex items-center gap-3">
                <span class="status-icon"></span>
                <p id="statusMessage" class="text-sm font-bold tracking-wide"></p>
            </div>
        </div>

        <ul id="resultList" class="flex flex-col gap-4 mt-2"></ul>
    </main>

    <footer class="text-center py-8 text-xs font-medium text-slate-400">
        &copy; 神罪閣下製作委員会
    </footer>

    <script src="app.js"></script>
</body>
</html>
